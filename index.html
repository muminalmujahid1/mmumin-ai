<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c6b4f" id="themeColorMeta">
<meta name="description" content="Mumin AI — আপনার স্মার্ট AI সহকারী।">
<meta name="application-name" content="Mumin AI">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mumin AI">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="color-scheme" content="light dark" id="colorSchemeMeta">
<title>Mumin AI</title>

<style>
:root {
  --bg: #ffffff;
  --sidebar: #fafaff;
  --text: #171724;
  --muted: #77788a;
  --border: #e9e8f2;
  --hover: #f0effa;
  --accent: #6558e8;
  --blue: #599bff;
  --purple: #8b5cf6;
  --user: #f0efff;
  --shadow: 0 8px 35px rgba(83, 74, 180, .08);
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: Arial, "Noto Sans Bengali", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

button, textarea, input {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

button:focus-visible,
textarea:focus-visible,
input:focus-visible {
  outline: 2px solid #9589ff;
  outline-offset: 3px;
}

.app {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
}

/* Soft animated background */

.app::before,
.app::after {
  position: absolute;
  z-index: -1;
  content: "";
  pointer-events: none;
  border-radius: 50%;
  filter: blur(75px);
  opacity: .20;
  animation: ambientFloat 15s ease-in-out infinite alternate;
}

.app::before {
  width: 340px;
  height: 340px;
  top: -170px;
  right: 8%;
  background: #b6b4ff;
}

.app::after {
  width: 300px;
  height: 300px;
  bottom: -190px;
  left: 32%;
  background: #a9d9ff;
  animation-delay: -7s;
}

@keyframes ambientFloat {
  0% {
    transform: translate3d(-12px, 0, 0) scale(1);
  }
  50% {
    transform: translate3d(25px, 22px, 0) scale(1.12);
  }
  100% {
    transform: translate3d(-8px, 38px, 0) scale(.94);
  }
}

/* Sidebar */

.sidebar {
  position: fixed;
  z-index: 20;
  inset: 0 auto 0 0;
  width: 280px;
  padding: 13px;
  display: flex;
  flex-direction: column;
  background: rgba(250, 250, 255, .96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  transform: translateX(-102%);
  visibility: hidden;
  transition:
    transform .28s cubic-bezier(.2,.8,.2,1),
    visibility .28s;
}

.app.sidebar-open .sidebar {
  transform: translateX(0);
  visibility: visible;
}

.sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 2px 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 19px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.brand-mark {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: #fff;
  background: linear-gradient(135deg, #5599ff, #7956ed 65%, #a56cf8);
  box-shadow: 0 4px 12px #7860ed35;
  font-size: 17px;
  font-weight: 800;
}
.brand-mark.actual-brand-mark {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  display: flex;
  overflow: hidden;
  padding: 0;
  border-radius: 50%;
  background: #fff;
  border: 1px solid rgba(110, 145, 190, .22);
  box-shadow: 0 4px 13px rgba(60, 80, 120, .14);
}
.brand-mark.actual-brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}


.icon-button {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  transition:
    background .2s,
    border-color .2s,
    transform .2s;
}

.icon-button:hover {
  background: #eeedfa;
  border-color: #e5e1ff;
}

.icon-button:active {
  transform: scale(.93);
}

.icon-button svg {
  width: 21px;
  height: 21px;
}

.new-chat {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  margin-bottom: 20px;
  border: 1px solid #e0dcff;
  border-radius: 13px;
  background: linear-gradient(110deg, #f1f2ff, #f8f5ff);
  color: #5144be;
  text-align: left;
  font-weight: 600;
  transition:
    transform .2s,
    box-shadow .2s,
    background .2s;
}

.new-chat:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 16px #7860ed16;
  background: linear-gradient(110deg, #e9edff, #f2eaff);
}

.new-chat:active {
  transform: scale(.98);
}

.new-chat svg {
  width: 20px;
  height: 20px;
}

.history-label {
  padding: 0 10px 9px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}

.history {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  padding: 3px;
  border: 1px solid transparent;
  border-radius: 11px;
  transition: background .18s, border-color .18s;
  animation: historyAppear .25s ease both;
}

@keyframes historyAppear {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.history-item:hover,
.history-item.active {
  background: #efedfc;
  border-color: #e8e3ff;
}

.open-chat {
  flex: 1;
  min-width: 0;
  padding: 10px 8px;
  overflow: hidden;
  border: 0;
  background: transparent;
  color: var(--text);
  text-align: left;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
}

.history-action {
  width: 31px;
  height: 31px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  transition: background .18s, color .18s;
}

.history-action:hover {
  background: #dfdcf7;
  color: #5144be;
}

.history-action svg {
  width: 16px;
  height: 16px;
}

.history-empty {
  padding: 12px 10px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.sidebar-bottom {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 5px 3px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #8b7cf6;
  box-shadow: 0 0 9px #8b7cf655;
}


/* Share action inside the sidebar */
.share-app-button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  margin: 0 0 17px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--sidebar);
  color: var(--text);
  text-align: left;
  font-size: 13px;
  font-weight: 650;
  transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
}
.share-app-button:hover {
  transform: translateY(-1px);
  border-color: rgba(95, 150, 245, .45);
  background: var(--hover);
  box-shadow: 0 5px 16px rgba(70, 110, 210, .09);
}
.share-app-button:active { transform: scale(.985); }
.share-app-button svg { width: 19px; height: 19px; flex: 0 0 19px; }
.share-app-button .share-arrow { margin-left: auto; color: var(--muted); font-size: 17px; }

/* Main workspace */

.workspace {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  transition: margin-left .28s;
}

.topbar {
  height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 15px;
  background: rgba(255,255,255,.78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(232,230,245,.7);
}

.top-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 15px;
  font-weight: 650;
}

.top-badge {
  margin-left: 3px;
  padding: 4px 8px;
  border: 1px solid #e4e0ff;
  border-radius: 7px;
  background: linear-gradient(110deg, #f0f2ff, #f9f1ff);
  color: #6855cf;
  font-size: 10px;
  font-weight: 700;
}

.chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 28px 18px 32px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  scroll-behavior: smooth;
  scrollbar-color: #dedcf0 transparent;
  scrollbar-width: thin;
}

/* Welcome screen */

.welcome {
  width: 100%;
  max-width: 700px;
  margin: auto auto;
  padding: 28px 12px;
  text-align: center;
  animation: welcomeIn .65s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes welcomeIn {
  from {
    opacity: 0;
    transform: translateY(15px) scale(.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.welcome-symbol {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  margin: 0 auto 20px;
  border: 1px solid #e4e0ff;
  border-radius: 23px;
  background: linear-gradient(135deg, #edf4ff, #f1edff 60%, #f9edff);
  box-shadow:
    0 8px 24px #7e70e518,
    inset 0 1px 0 #ffffff;
  color: #6c62dd;
  animation: symbolFloat 4s ease-in-out infinite;
}

.welcome-symbol svg {
  width: 32px;
  height: 32px;
}

@keyframes symbolFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.welcome h1 {
  margin: 0 0 10px;
  font-size: clamp(24px, 4vw, 34px);
  font-weight: 750;
  letter-spacing: -1.1px;
  background: linear-gradient(100deg, #292c48, #6559d9 55%, #8c65db);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.welcome p {
  margin: 0;
  color: #77788b;
  font-size: 14px;
  line-height: 1.9;
}


/* Circular floating Mumin AI logo on the welcome screen */
.welcome-symbol {
  position: relative;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  padding: 5px;
  overflow: visible;
  background: #fff;
  border: 1px solid rgba(112, 155, 220, .24);
  box-shadow: 0 10px 28px rgba(70, 125, 210, .15), 0 0 0 7px rgba(110, 170, 255, .055);
  animation: symbolFloat 4s ease-in-out infinite, logoHalo 3.2s ease-in-out infinite;
}
.welcome-symbol::before {
  content: "";
  position: absolute;
  inset: -6px;
  z-index: -1;
  border-radius: 50%;
  border: 1px solid rgba(103, 166, 255, .25);
  animation: logoRing 3.2s ease-out infinite;
}
.welcome-symbol img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  border-radius: 50%;
}
@keyframes logoHalo {
  0%, 100% { box-shadow: 0 10px 28px rgba(70,125,210,.14), 0 0 0 6px rgba(110,170,255,.05); }
  50% { box-shadow: 0 12px 34px rgba(70,125,210,.24), 0 0 0 10px rgba(110,170,255,.09); }
}
@keyframes logoRing {
  0% { transform: scale(.92); opacity: .55; }
  75%, 100% { transform: scale(1.18); opacity: 0; }
}
#app[data-theme="dark"] .welcome-symbol {
  background: #fff;
  border-color: rgba(120, 175, 255, .4);
  box-shadow: 0 10px 32px rgba(0,0,0,.25), 0 0 0 7px rgba(100,160,255,.08);
}

/* Messages */

.message-row {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  animation: messageIn .32s cubic-bezier(.2,.7,.3,1) both;
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(9px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message {
  max-width: 84%;
  padding: 12px 16px;
  border-radius: 20px;
  font-size: 15px;
  line-height: 1.85;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #f1f1ff, #f5efff);
  border: 1px solid #eae6ff;
  border-bottom-right-radius: 6px;
  color: #25233c;
}

.message.assistant {
  align-self: flex-start;
  padding: 8px 0;
  background: transparent;
  color: #242434;
}

.message.error {
  color: #bd303d;
}

.message.pending {
  color: #77788a;
  font-size: 14px;
}

.message-copy {
  align-self: flex-start;
  display: none;
  align-items: center;
  gap: 5px;
  margin-top: 3px;
  padding: 6px 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: #77788a;
  font-size: 12px;
  transition: background .18s;
}

.message-row:hover .message-copy,
.message-copy:focus-visible {
  display: inline-flex;
}

.message-copy:hover {
  background: #f0effa;
  border-color: #e9e6ff;
}

.typing-dots {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 3px;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #9184ed;
  animation: typing 1.1s infinite ease-in-out;
}

.typing-dots span:nth-child(2) {
  animation-delay: .15s;
}

.typing-dots span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes typing {
  0%, 60%, 100% {
    opacity: .35;
    transform: translateY(0);
  }
  30% {
    opacity: 1;
    transform: translateY(-4px);
  }
}

/* Composer */

.composer-area {
  flex-shrink: 0;
  padding: 10px 16px 13px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.76),
    rgba(255,255,255,.97) 24%
  );
}

.composer {
  position: relative;
  width: 100%;
  max-width: 760px;
  min-height: 56px;
  margin: 0 auto;
  padding: 8px 9px 8px 17px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  border: 1px solid #e2e0ee;
  border-radius: 27px;
  background: rgba(255,255,255,.97);
  box-shadow:
    0 3px 8px #34305b05,
    0 7px 25px #6558e809;
  transition:
    border-color .25s,
    box-shadow .25s,
    transform .25s;
}

.composer:focus-within {
  border-color: #c5bcff;
  box-shadow:
    0 0 0 3px #9d8cff13,
    0 8px 28px #6558e812;
}

#prompt {
  flex: 1;
  min-width: 0;
  min-height: 38px;
  max-height: 180px;
  padding: 9px 0;
  resize: none;
  overflow-y: auto;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}

#prompt::placeholder {
  color: #8b8b9b;
}

#prompt:focus-visible {
  outline: none;
}

.send-button {
  position: relative;
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, #5c9eff, #7163ef 55%, #9259e9);
  color: #fff;
  box-shadow: 0 3px 10px #7463e738;
  transition:
    transform .2s,
    box-shadow .2s,
    filter .2s,
    background .2s;
}

.send-button::before {
  position: absolute;
  inset: 0;
  content: "";
  border-radius: inherit;
  background: linear-gradient(120deg, #ffffff45, transparent 55%);
  opacity: 0;
  transition: opacity .2s;
}

.send-button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 17px #7463e754;
  filter: saturate(1.15);
}

.send-button:hover:not(:disabled)::before {
  opacity: 1;
}

.send-button:active:not(:disabled) {
  transform: scale(.91);
}

.send-button:disabled {
  background: #e7e6ef;
  box-shadow: none;
  color: #a1a0b0;
  opacity: 1;
}

.send-button svg {
  position: relative;
  z-index: 1;
  width: 20px;
  height: 20px;
  transition: transform .2s;
}

.send-button:hover:not(:disabled) svg {
  transform: translateY(-2px);
}

.disclaimer {
  padding-top: 10px;
  text-align: center;
  color: #89899a;
  font-size: 11px;
  line-height: 1.6;
}

/* Sidebar backdrop */

.backdrop {
  position: fixed;
  z-index: 15;
  inset: 0;
  display: none;
  border: 0;
  background: rgba(36, 32, 67, .20);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  animation: backdropIn .2s ease both;
}

@keyframes backdropIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.app.sidebar-open .backdrop {
  display: block;
}

/* Dialogs */

.dialog-backdrop {
  position: fixed;
  z-index: 50;
  inset: 0;
  padding: 18px;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(31, 28, 56, .22);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.dialog-backdrop.visible {
  display: flex;
  animation: backdropIn .18s ease both;
}

.dialog {
  width: 100%;
  max-width: 370px;
  padding: 21px;
  border: 1px solid #e8e5f6;
  border-radius: 19px;
  background: #fff;
  box-shadow: 0 18px 55px #30265a20;
  animation: dialogIn .22s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes dialogIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.dialog h2 {
  margin: 0 0 15px;
  font-size: 18px;
}

.dialog input {
  width: 100%;
  padding: 12px;
  border: 1px solid #dedcea;
  border-radius: 10px;
  background: #fff;
  outline: none;
}

.dialog input:focus {
  border-color: #9c8df8;
  box-shadow: 0 0 0 3px #9c8df817;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 17px;
}

.dialog-actions button {
  padding: 9px 14px;
  border: 1px solid #e6e4ef;
  border-radius: 9px;
  background: #f8f8fc;
  color: var(--text);
  transition: background .2s, transform .2s;
}

.dialog-actions button:hover {
  background: #eeedf7;
}

.dialog-actions button:active {
  transform: scale(.97);
}

.dialog-actions .primary {
  border-color: transparent;
  background: linear-gradient(120deg, #5c8fff, #7861ed);
  color: #fff;
}

.dialog-actions .primary:hover {
  background: linear-gradient(120deg, #4d81f4, #6c51df);
}

.dialog-actions .delete {
  border-color: transparent;
  background: #c83c4b;
  color: #fff;
}

/* Desktop sidebar */

@media (min-width: 900px) {
  .app.sidebar-open .workspace {
    margin-left: 280px;
    width: calc(100% - 280px);
  }

  .app.sidebar-open .sidebar {
    transform: translateX(0);
  }

  .app.sidebar-open .backdrop {
    display: none;
  }
}



/* User-provided Mumin AI crescent-tech logo beside the menu button */
.top-brand-mark {
  width: 58px;
  height: 44px;
  flex: 0 0 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 50%;
  background: #fff;
  border: 1px solid rgba(130, 150, 180, .18);
  box-shadow: 0 3px 12px rgba(30, 50, 80, .12);
}
.top-brand-mark img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
@media (max-width: 520px) {
  .topbar { gap: 7px; padding-left: 9px; padding-right: 9px; }
  .top-brand-mark {
    width: 47px;
    height: 40px;
    flex-basis: 47px;
    border-radius: 50%;
  }
}
/* Theme modes */
:root {
  color-scheme: light;
}
#app[data-theme="dark"] {
